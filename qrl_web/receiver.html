<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>QRL Web — Receiver</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Courier New', monospace; background: #0d0d0d; color: #e0e0e0; min-height: 100vh; padding: 20px; padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); max-width: 700px; margin: 0 auto; }
  h1 { color: #00ff88; font-size: 1.5rem; letter-spacing: 0.1em; margin-bottom: 4px; }
  nav { color: #555; font-size: 0.8rem; margin-bottom: 24px; }
  nav a { color: #00ff88; text-decoration: none; padding: 4px 0; display: inline-block; }
  button { font-family: 'Courier New', monospace; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: opacity 0.15s; min-height: 44px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary { background: #00ff88; color: #000; }
  .btn-secondary { background: #2a2a2a; color: #e0e0e0; border: 1px solid #333; }
  .btn-danger { background: #cc3333; color: #fff; }
  .btn-green { background: #00aa55; color: #fff; }
  .action-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .status { font-size: 0.82rem; min-height: 1.2em; margin-bottom: 12px; padding: 8px 12px; border-radius: 5px; border: 1px solid #222; background: #111; }
  .status.ok { border-color: #00ff88; color: #00ff88; }
  .status.warn { border-color: #ffaa00; color: #ffaa00; }
  .status.err { border-color: #cc3333; color: #cc3333; }
  .status.idle { color: #555; }
  .video-wrap { position: relative; margin-bottom: 16px; border-radius: 8px; overflow: hidden; background: #000; border: 2px solid #222; }
  #video { width: 100%; display: block; min-height: 180px; max-height: 60vh; object-fit: cover; }
  .scan-overlay { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); border-radius: 5px; padding: 4px 10px; font-size: 0.75rem; }
  .scan-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #555; margin-right: 6px; transition: background 0.1s; }
  .scan-dot.active { background: #00ff88; }
  .manifest-card { background: #111; border: 1px solid #222; border-radius: 8px; padding: 14px 18px; margin-bottom: 16px; font-size: 0.82rem; line-height: 1.8; }
  .manifest-card .fname { color: #00ff88; font-size: 0.95rem; }
  .progress-section { margin-bottom: 16px; }
  .prog-numbers { display: flex; justify-content: space-between; font-size: 0.78rem; color: #666; margin-bottom: 6px; }
  .prog-numbers span { color: #00ff88; }
  .progress-bar { width: 100%; height: 10px; background: #1a1a1a; border-radius: 5px; overflow: hidden; }
  .progress-fill { height: 100%; background: #00ff88; transition: width 0.2s; border-radius: 5px; }
  .stats-row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { display: flex; flex-direction: column; gap: 3px; }
  .stat-val { font-size: 1.3rem; color: #00ff88; font-weight: bold; }
  .stat-lbl { font-size: 0.68rem; color: #555; letter-spacing: 0.1em; }
  .camera-select { background: #1a1a1a; color: #e0e0e0; border: 1px solid #333; padding: 10px 10px; border-radius: 5px; font-family: 'Courier New', monospace; font-size: max(16px, 0.8rem); min-height: 44px; margin-bottom: 12px; width: 100%; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .hidden { display: none !important; }
  .blink { animation: blink 0.15s; }
  @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0.1 } }
  .download-btn { margin-top: 8px; }
  .chunk-map { margin-bottom: 16px; }
  .chunk-map-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .chunk-map-lbl { font-size: 0.72rem; color: #555; letter-spacing: 0.1em; }
  .chunk-grid { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 8px; }
  .chunk-cell { width: 10px; height: 10px; border-radius: 2px; background: #1a1a1a; flex-shrink: 0; }
  .chunk-cell.ok { background: #00ff88; }
  .chunk-cell.partial { background: #cc8800; }
  .missing-list { font-size: 0.72rem; color: #666; word-break: break-all; max-height: 54px; overflow-y: auto; line-height: 1.6; }
  @media (max-width: 540px) {
    .stats-row { gap: 16px; }
    .stat-val { font-size: 1.1rem; }
    .action-row { gap: 8px; }
    .action-row button { flex: 1; }
  }
</style>
</head>
<body>
<h1>QRL WEB — RECEIVER</h1>
<nav><a href="index.html">← Home</a> &nbsp;|&nbsp; <a href="sender.html">Open Sender →</a></nav>

<select id="cameraSelect" class="camera-select hidden"></select>

<div class="action-row">
  <button class="btn-primary" id="startBtn" onclick="startCamera()">Start Camera</button>
  <button class="btn-danger hidden" id="stopBtn" onclick="stopCamera()">Stop</button>
  <button class="btn-secondary hidden" id="resetBtn" onclick="resetState()">Reset / New Transfer</button>
</div>

<div class="status idle" id="statusMsg">Press Start Camera to begin scanning.</div>

<div class="video-wrap hidden" id="videoWrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="capCanvas" class="hidden"></canvas>
  <div class="scan-overlay">
    <span class="scan-dot" id="scanDot"></span><span id="scanTxt">waiting…</span>
  </div>
</div>

<div class="manifest-card hidden" id="manifestCard"></div>

<div class="progress-section hidden" id="progressSection">
  <div class="prog-numbers">
    <span>Chunks received: <span id="pReceived">0</span> / <span id="pTotal">?</span></span>
    <span id="pPct">0%</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
</div>

<div class="chunk-map hidden" id="chunkMap">
  <div class="chunk-map-header">
    <span class="chunk-map-lbl">CHUNK MAP</span>
    <button class="btn-secondary" style="padding:8px 14px;font-size:0.75rem" onclick="copyMissing()">Copy Missing</button>
  </div>
  <div id="chunkGrid" class="chunk-grid"></div>
  <div id="missingList" class="missing-list"></div>
</div>

<div class="stats-row hidden" id="statsRow">
  <div class="stat"><div class="stat-val" id="sScans">0</div><div class="stat-lbl">FRAMES SCANNED</div></div>
  <div class="stat"><div class="stat-val" id="sHits">0</div><div class="stat-lbl">QR HITS</div></div>
  <div class="stat"><div class="stat-val" id="sNew">0</div><div class="stat-lbl">NEW CHUNKS</div></div>
  <div class="stat"><div class="stat-val" id="sDups">0</div><div class="stat-lbl">DUPLICATES</div></div>
</div>

<button class="btn-green download-btn hidden" id="downloadBtn" onclick="downloadFile()">Download File</button>

<script src="vendor/jsQR.js"></script>
<script src="vendor/pako.min.js"></script>
<script src="receiver.js"></script>
</body>
</html>
