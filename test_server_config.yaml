# QRL Server Configuration File
# This file contains default settings for the QRL server
# Adjust values as needed for your use case

chunk_size:  # Size of data chunks in bytes (affects QR capacity) 1024
compression_level: 6
duration:  # Display time per QR code in seconds 2.0
error_correction:  # QR error correction level: L, M, Q, H (higher = more robust) Q
fullscreen: false
max_file_size:  # Maximum file size to process (bytes) 104857600
output_format: PNG
qr_border: 4
qr_box_size: 10
qr_version:  # QR code version (1-40), null = auto-detect null
repeat:  # Whether to repeat the QR sequence continuously true
save_qr: null
window_height: 600
window_title:  # Title of the display window QRL Server
window_width: 800
